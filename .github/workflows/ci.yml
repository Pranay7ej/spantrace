name: ci

on:
  push:
  pull_request:

jobs:
  runtime-asan:
    name: runtime (asan, no llvm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DSPANTRACE_BUILD_PASS=OFF -DSPANTRACE_SANITIZE=address
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  full:
    name: pass + runtime (llvm 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev llvm-18-tools clang-18 libpolly-18-dev \
            libzstd-dev zlib1g-dev libedit-dev libffi-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Overhead benchmark
        run: |
          bench/overhead.sh build clang++-18 5 | tee overhead.md
          { echo "## Overhead"; echo; cat overhead.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Top functions (traced workload)
        run: |
          python3 tools/top.py build/overhead/traced.json -n 15 | tee top.txt
          { echo '## top.py'; echo '```'; cat top.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: traces
          path: |
            build/overhead/*.json
            overhead.md

  tinyplayer-example:
    name: trace tinyplayer (real-world example)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev llvm-18-tools clang-18 libpolly-18-dev \
            libzstd-dev zlib1g-dev libedit-dev libffi-dev libcurl4-openssl-dev \
            ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Build spantrace
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DSPANTRACE_BUILD_TESTS=OFF
          cmake --build build -j
      - name: Build tinyplayer with the plugin
        run: |
          git clone --depth 1 https://github.com/Pranay7ej/tinyplayer.git tp
          cmake -S tp -B tp/build -DTP_BUILD_TESTS=OFF -DTP_WITH_SDL=OFF \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-fpass-plugin=$PWD/build/pass/SpanTracePass.so -mllvm -spantrace-filter=^tp::" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="$PWD/build/runtime/libspantrace.a -lpthread"
          cmake --build tp/build -j --target tinyplayer
      - name: Play 20 s headless and trace it
        run: |
          tp/tools/make_test_stream.sh stream 20
          SPANTRACE_OUT=tinyplayer.json tp/build/tinyplayer stream --headless --kbps 8000
          python3 tools/top.py tinyplayer.json -n 15 | tee top.txt
          { echo '## tinyplayer'; echo '```'; cat top.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tinyplayer-trace
          path: tinyplayer.json
