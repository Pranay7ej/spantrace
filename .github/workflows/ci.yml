name: ci

on:
  push:
  pull_request:

jobs:
  runtime-asan:
    name: runtime (asan, no llvm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DSPANTRACE_BUILD_PASS=OFF -DSPANTRACE_SANITIZE=address
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  full:
    name: pass + runtime (llvm 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev llvm-18-tools clang-18 libpolly-18-dev \
            libzstd-dev zlib1g-dev libedit-dev libffi-dev libcurl4-openssl-dev
      - name: Configure
        run: .github/run_and_report.sh configure cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DSPANTRACE_REQUIRE_PASS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: .github/run_and_report.sh tests ctest --test-dir build --output-on-failure
      - name: Overhead benchmark
        run: |
          set -o pipefail
          bench/overhead.sh build clang++-18 5 | tee overhead.md
          .github/run_and_report.sh overhead cat overhead.md
          { echo "## Overhead"; echo; cat overhead.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Top functions (traced workload)
        run: |
          python3 tools/top.py build/overhead/traced.json -n 15 | tee top.txt
          .github/run_and_report.sh top-workload cat top.txt
          { echo '## top.py'; echo '```'; cat top.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: traces
          path: |
            build/overhead/*.json
            overhead.md

  lsmkv-example:
    name: trace lsmkv (real-world example)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev llvm-18-tools clang-18 libpolly-18-dev \
            libzstd-dev zlib1g-dev libedit-dev libffi-dev libcurl4-openssl-dev
      - name: Build spantrace
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DSPANTRACE_BUILD_TESTS=OFF -DSPANTRACE_REQUIRE_PASS=ON
          cmake --build build -j
      - name: Build lsmkv with the plugin
        run: |
          git clone --depth 1 https://github.com/Pranay7ej/lsmkv.git kv
          .github/run_and_report.sh lsmkv-configure cmake -S kv -B kv/build -DLSMKV_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-fpass-plugin=$PWD/build/pass/SpanTracePass.so -Xclang -load -Xclang $PWD/build/pass/SpanTracePass.so -mllvm -spantrace-filter=^lsmkv::" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="$PWD/build/runtime/libspantrace.a -lpthread"
          .github/run_and_report.sh lsmkv-build cmake --build kv/build -j --target db_bench
      - name: Run db_bench traced
        run: |
          SPANTRACE_OUT=lsmkv.json SPANTRACE_BUF_EVENTS=4194304 kv/build/db_bench --num 100000 --dir /tmp/kvbench
          python3 tools/top.py lsmkv.json -n 15 | tee top.txt
          .github/run_and_report.sh top-lsmkv cat top.txt
          { echo '## lsmkv'; echo '```'; cat top.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lsmkv-trace
          path: lsmkv.json
